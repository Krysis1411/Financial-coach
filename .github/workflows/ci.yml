name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  app:
    name: App build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed because `npm ci` runs the postinstall hook, which calls uv.
      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
